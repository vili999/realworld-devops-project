name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w frontend

      - name: Run tests
        run: npm test

      - name: Build backend Docker image
        run: docker build -t realworld-backend:test -f backend/Dockerfile .

      - name: Build frontend Docker image
        run: docker build -t realworld-frontend:test -f frontend/Dockerfile .

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL